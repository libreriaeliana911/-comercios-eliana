<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librería Juguetería Eliana - Catálogo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f6f9; color: #333; text-align: center; }
        header { background-color: #2980b9; color: white; padding: 30px 20px; }
        .back-btn { display: inline-block; margin: 20px 0; color: #2980b9; text-decoration: none; font-weight: bold; }
        .search-container { max-width: 500px; margin: 20px auto; padding: 0 20px; }
        .search-bar { width: 100%; padding: 12px 20px; border: 2px solid #2980b9; border-radius: 25px; font-size: 1rem; outline: none; }
        .grid { max-width: 900px; margin: 10px auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .item { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
        .price { color: #2980b9; font-weight: bold; font-size: 1.3rem; margin: 10px 0; }
        .btn-wsp { display: inline-block; background-color: #25d366; color: white; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; transition: background 0.2s; }
        .btn-wsp:hover { background-color: #20ba5a; }
        .no-results { display: none; margin: 40px auto; color: #666; font-size: 1.1rem; }
    </style>
</head>
<body>

    <header>
        <h1>Librería Juguetería Eliana</h1>
        <p>Útiles escolares, comerciales, regalos y juegos para todas las edades</p>
    </header>

    <a href="index.html" class="back-btn">⬅ Volver al Inicio</a>

    <!-- BUSCADOR -->
    <div class="search-container">
        <input type="text" id="search-input" class="search-bar" placeholder="🔍 Buscar útiles o juguetes..." onkeyup="filtrarProductos()">
    </div>

    <p id="no-results-msg" class="no-results">No se encontraron productos con ese nombre.</p>

    <!-- LISTA DE PRODUCTOS -->
    <div class="grid" id="products-grid">
        <div class="item">
            <h3 class="product-name">Resma A4</h3>
            <p>unidad</p>
            <p class="price">$4500</p>
            <a href="#" onclick="consultarProducto('Resma A4', '4500', 'unidad')" class="btn-wsp">Consultar</a>
        </div>
        <div class="item">
            <h3 class="product-name">Cuaderno Rivadavia</h3>
            <p>unidad</p>
            <p class="price">$3200</p>
            <a href="#" onclick="consultarProducto('Cuaderno Rivadavia', '3200', 'unidad')" class="btn-wsp">Consultar</a>
        </div>
    </div>

    <script>
        function filtrarProductos() {
            let input = document.getElementById('search-input').value.toLowerCase();
            let items = document.getElementsByClassName('item');
            let noResults = document.getElementById('no-results-msg');
            let encontrados = 0;

            for (let i = 0; i < items.length; i++) {
                let name = items[i].getElementsByClassName('product-name')[0].innerHTML.toLowerCase();
                if (name.includes(input)) {
                    items[i].style.display = "flex";
                    encontrados++;
                } else {
                    items[i].style.display = "none";
                }
            }
            if (encontrados === 0) { noResults.style.display = "block"; } 
            else { noResults.style.display = "none"; }
        }

        function consultarProducto(nombre, precio, unidad) {
    // CAMBIO CLAVE: Usamos el enlace completo oficial para ganarle al traductor
    let numeroTelefono = "542914707417";
    let mensaje = "Hola! Vi en la web que tienen " + nombre + " (" + unidad + " $" + precio + "). ¿Tienen stock disponible para pasar a buscar por el local?";
    
    // Aquí cambiamos 'wa.me' por '://whatsapp.com' que es inmune a las traducciones
    let enlaceWhatsApp = "https://://whatsapp.com?phone=" + numeroTelefono + "&text=" + encodeURIComponent(mensaje);
    window.open(enlaceWhatsApp, '_blank');
}
